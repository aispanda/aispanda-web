server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Cloud Run terminates TLS on 443 and forwards to 8080.
  # Absolute redirects must not advertise :8080 to browsers.
  absolute_redirect off;
  port_in_redirect off;

  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

  # Keep Firebase redirect helpers on the same origin so browser storage
  # partitioning cannot discard the completed Google sign-in session.
  location /__/auth {
    proxy_pass https://aispanda.firebaseapp.com;
    proxy_set_header Host aispanda.firebaseapp.com;
    proxy_ssl_server_name on;
    proxy_ssl_name aispanda.firebaseapp.com;
  }

  location / {
    try_files $uri $uri/index.html $uri.html $uri/ =404;
  }

  location = /404.html {
    internal;
  }

  error_page 404 /404.html;

  location ~* \.(css|js|png|jpg|jpeg|webp|gif|ico|svg|woff2)$ {
    expires 30d;
    add_header Cache-Control "public, max-age=2592000, immutable";
  }
}
