name: quality

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.16.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:ai
      - run: pnpm build
      - run: pnpm exec playwright install chromium
      - run: pnpm test:e2e
      - name: Upload Playwright failure artefacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-artefacts
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  preview-chromium:
    name: Preview Chromium
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    needs: chromium
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CANDIDATE_SHA: ${{ github.event.pull_request.head.sha }}
      CANDIDATE_BRANCH: ${{ github.head_ref }}
      PULL_REQUEST_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: pnpm/action-setup@v4
        with:
          version: 11.16.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install chromium
      - name: Resolve immutable Cloudflare Pages preview URL
        id: preview
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          candidate_short_sha="${CANDIDATE_SHA:0:7}"
          attempts=0
          preview_url=""
          until [ -n "$preview_url" ]; do
            comments="$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PULL_REQUEST_NUMBER}/comments?per_page=100")"
            preview_url="$(printf '%s' "$comments" | jq -r --arg sha "$candidate_short_sha" '
              [ .[]
                | select(.user.login == "cloudflare-workers-and-pages[bot]")
                | select(.body | contains($sha))
                | try (.body | capture("Preview URL:[[:space:]]*(?<url>https://[^[:space:]]+)").url) catch empty
              ] | last // empty
            ')"
            if [ -n "$preview_url" ]; then
              break
            fi
            attempts=$((attempts + 1))
            if [ "$attempts" -ge 60 ]; then
              echo "Cloudflare did not publish an immutable preview URL for candidate ${CANDIDATE_SHA}." >&2
              exit 1
            fi
            sleep 10
          done
          deployment_identifier="${preview_url#https://}"
          deployment_identifier="${deployment_identifier%%.*}"
          echo "url=$preview_url" >> "$GITHUB_OUTPUT"
          echo "deployment_identifier=$deployment_identifier" >> "$GITHUB_OUTPUT"
          printf 'Preview candidate: %s\nCommit: %s\nDeployment: %s\n' "$preview_url" "$CANDIDATE_SHA" "$deployment_identifier" >> "$GITHUB_STEP_SUMMARY"
      - name: Verify Cloudflare preview boundary
        id: preview-ready
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.url }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --head "$PREVIEW_URL/support-form-demo" | tee preview-response-headers.txt
          if ! grep -Eiq '^x-robots-tag:.*noindex' preview-response-headers.txt; then
            echo "Expected Cloudflare preview noindex header is missing: $PREVIEW_URL" >&2
            exit 1
          fi
      - name: Run Playwright against Cloudflare Pages preview
        id: preview-e2e
        env:
          PLAYWRIGHT_BASE_URL: ${{ steps.preview.outputs.url }}
        run: pnpm test:e2e
      - name: Write preview evidence receipt
        if: always()
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.url }}
          DEPLOYMENT_IDENTIFIER: ${{ steps.preview.outputs.deployment_identifier }}
          PLAYWRIGHT_RESULT: ${{ steps.preview-e2e.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          cat > preview-evidence-receipt.json <<EOF
          {
            "candidate_sha": "${CANDIDATE_SHA}",
            "candidate_branch": "${CANDIDATE_BRANCH}",
            "preview_url": "${PREVIEW_URL}",
            "deployment_identifier": "${DEPLOYMENT_IDENTIFIER}",
            "environment": "non-production",
            "playwright_result": "${PLAYWRIGHT_RESULT}",
            "production_domain_touched": false
          }
          EOF
          cat preview-evidence-receipt.json >> "$GITHUB_STEP_SUMMARY"
      - name: Upload preview evidence receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: preview-evidence-receipt
          path: |
            preview-evidence-receipt.json
            preview-response-headers.txt
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
